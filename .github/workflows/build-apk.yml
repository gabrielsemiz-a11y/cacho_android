name: Build Cachito Android v2.41 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Debug APK (Cachito v2.41)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK con versión
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Cachito-Android-v2.41.apk

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: Cachito-Android-v2.41-APK
          path: dist/Cachito-Android-v2.41.apk
          retention-days: 30
